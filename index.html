<!doctype html>
<html lang="en-us">
  <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Pocket Tanks Deluxe</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
    <meta name="description" content="boxedwine emulator">
    <meta name="keywords" content="emulator,wine,windows,x86,PC,emscripten,web assembly,wasm,boxedwine">
    <meta name="author" content="James Bryant, Kevin O'Dwyer">
      <link rel="stylesheet" type="text/css" href="boxedwine.css">

  </head>
  <body>
    <div id="run-inline" style="display: none">
        <button id="inline-runbtn" onclick="startInline()">inline</button>
    </div>

    <div id="inline">
        <div class="emscripten">
            <button id="saveFSImage" style="display: none" onclick="saveFSImage()">Save FS Image</button>         
            <button id="startbtn" style="display: none" onclick="start()">Start</button>
            <button id="uploadbtn" style="display: none" onclick="document.getElementById('upload').click()" >Add File(s)</button>
            <input style="display: none" id="upload" name="upload" onclick="document.getElementById('uploadbtn').click();" onchange="startWithFiles(event.target.files);"  type="file" multiple />
            <button id="downloadbtn" style="display: none" onclick="buildTree();">Get File(s)</button>
            <a style="display: none" id="modalLink" href="#openModal">Open</a>
            <a style="display: none" id="modalLinkExe" href="#openModalExe">Open</a>

          <span id="sound-checkbox" style="display: none">
              <input type="checkbox" id="soundToggle" onclick="toggleSound();" />Enable Sound
          </span>
          <label><input type="checkbox" id="pointerLock">Capture mouse</label>
          <label><input type="checkbox" id="showConsole" onclick="toggleConsole();">Show log</label>
          <label><input type="checkbox" id="stretch">Stretch display</label>
          <button id="fullscreen" type="button" aria-pressed="false">Fullscreen</button>
          <a id="display-mode"></a>
        </div>
        <div id="feedback"><span id="display-notice" role="alert"></span> <a id="recovery" hidden></a></div>
        <div id="dropzone">
            <div class="emscripten_border">
                <section id="loading" aria-label="Loading Pocket Tanks Deluxe">
                    <img src="assets/logo.webp" width="260" height="127" alt="Pocket Tanks">
                    <div id="transfer" role="status">Loading game engine…</div>
                    <progress id="transfer-progress" aria-label="Loading progress"></progress>
                </section>
                <canvas width="800" height="600" class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>
        </div>
        <div>
            <textarea class="emscripten" id="output" rows="8" style="display: none"></textarea>
        </div>
        <div id="openModal" class="modalDialog">
            <div> <a href="#close" title="Close" class="close" onclick="done();">X</a>
                <div>
                    <h3>Get File(s)</h3>
                    <input id="selectedItem" type="text" size="50" readonly>
                    <button onclick="extract();">Get</button>
                </div>
                <div id="tree" class="scroll-style">
                </div>
                <div>
                    <h3 id="loadStatus">Loading...</h3>
                </div>
            </div>
        </div>
        <div id="openModalExe" class="modalDialog">
            <div> <a id="openModalExeClick" href="#close" title="Close" class="close">X</a>
                <div>
                    <h3>Execute</h3>
                    <div id="message"></div>
                    <div id="items" class="scroll-style"></div>
                </div>
            </div>
        </div>
        <hr>
    </div>
        <!-- script src="dropbox.min.js"></script -->
        <script src="browserfs.boxedwine.js"></script>
        <script src="jszip.min.js"></script>
        <script src="boxedwine-shell.js"></script>
        <script src="audio/browser.js"></script>
        <script src="game-loader.js"></script>
        <script src="display.js"></script>
        <script src="game-input.js"></script>
        <script async src="boxedwine.js?v=relative-pointer-1"></script>
  </body>
</html>
